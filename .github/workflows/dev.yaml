name: Development tasks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.12", "3.11", "3.10", "pypy3.11", "pypy3.10"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --uploaded-prior-to P7D
          python -m pip install --group test --uploaded-prior-to P7D

      - name: Test with pytest
        run: |
          pytest --no-cov

      - name: Gather coverage by test_lib.py
        run: |
          pytest --cov --cov-report=xml --cov-fail-under=0 -- tests/test_lib.py

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python-${{ matrix.python-version }}

  lint:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.12", "3.11", "3.10"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --uploaded-prior-to P7D
          python -m pip install --group lint --uploaded-prior-to P7D

      - parallel:
        - name: Check types with mypy
          run: |
            mypy --version
            mypy

        - name: Lint with bandit
          run: |
            bandit --version
            bandit -r src/

        - name: Lint with flake8
          run: |
            flake8 --version
            flake8 src/ tests/

        - name: Lint with pylint
          run: |
            pylint --version
            pylint src/
