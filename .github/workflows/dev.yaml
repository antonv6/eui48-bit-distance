name: Development tasks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.13", "3.12", "3.11", "3.10", "pypy3.11", "pypy3.10"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --uploaded-prior-to P7D
          python -m pip install --group test --uploaded-prior-to P7D

      - name: Test with pytest
        run: |
          pytest --no-cov

      - name: Gather coverage by test_lib.py
        run: |
          pytest --cov --cov-report=xml --cov-fail-under=0 -- tests/test_lib.py

      - name: Upload results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python-${{ matrix.python-version }}

  lint:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.13", "3.12", "3.11", "3.10"]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools>=83.0.0 --uploaded-prior-to P7D
          python -m pip install --group lint --uploaded-prior-to P7D

      - parallel:
        - name: Check types with mypy
          run: |
            mypy --version
            mypy --install-types --non-interactive

        - name: Lint with bandit
          run: |
            bandit --version
            bandit -r docs/ src/

        - name: Lint with flake8
          run: |
            flake8 --version
            flake8 docs/ src/ tests/

        - name: Lint with pylint
          run: |
            pylint --version
            pylint src/

        - name: Validate pyproject.toml
          run: |
            validate-pyproject --version
            validate-pyproject pyproject.toml

        - name: Audit the Python environment
          run: |
            pip-audit --version
            pip-audit --strict --desc on --aliases on
