name: Development tasks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --uploaded-prior-to P7D
          python -m pip install --group build --uploaded-prior-to P7D

      - name: Build
        run: |
          python -m build

      - name: Check distributions
        run: |
          twine check --strict dist/*

      - name: Check wheel contents
        run: |
          check-wheel-contents dist/

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.13", "3.12", "3.11", "3.10", "pypy3.11", "pypy3.10"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --uploaded-prior-to P7D
          python -m pip install --group test --uploaded-prior-to P7D

      - name: Test with pytest
        run: |
          pytest --no-cov

      - name: Gather coverage by test_lib.py
        run: |
          pytest --cov --cov-report=xml --cov-fail-under=0 -- tests/test_lib.py

      - name: Upload results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python-${{ matrix.python-version }}

  lint:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.13", "3.12", "3.11", "3.10"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools>=83.0.0 --uploaded-prior-to P7D
          python -m pip install --group lint --uploaded-prior-to P7D

      - parallel:
        - name: Check types with mypy
          run: |
            mypy --version
            mypy --install-types --non-interactive

        - name: Lint with bandit
          run: |
            bandit --version
            bandit -r docs/ src/

        - name: Lint with flake8
          run: |
            flake8 --version
            flake8 docs/ src/ tests/

        - name: Lint with pylint
          run: |
            pylint --version
            pylint src/

        - name: Validate pyproject.toml
          run: |
            validate-pyproject --version
            validate-pyproject pyproject.toml

        - name: Audit the Python environment
          run: |
            pip-audit --version
            pip-audit --strict --desc on --aliases on
