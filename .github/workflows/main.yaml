name: Development tasks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.12", "3.11", "3.10"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --uploaded-prior-to P7D
          python -m pip install --group test --uploaded-prior-to P7D

      - name: Test with pytest
        run: |
          pytest

  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    needs:
      - test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --uploaded-prior-to P7D
          python -m pip install --group build --uploaded-prior-to P7D

      - name: Build
        run: |
          python -m build

      - name: Check distributions
        run: |
          twine check dist/*

      - name: Upload release distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/
