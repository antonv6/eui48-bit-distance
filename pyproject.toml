[project]
name = "eui48-bit-distance"
version = "0.3.1"
description = "Calculate bit distance between EUI-48 (MAC)."
authors = [
    {name = "Anton Shestakov", email = "av6@dwimlabs.net"}
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
"Source" = "https://github.com/antonv6/eui48-bit-distance"
"Issues" = "https://github.com/antonv6/eui48-bit-distance/issues"
"Changelog" = "https://github.com/antonv6/eui48-bit-distance/blob/main/CHANGELOG.md"
"Download" = "https://github.com/antonv6/eui48-bit-distance/releases"
"Docs" = "https://antonv6.github.io/eui48-bit-distance/"

[build-system]
requires = ["setuptools >= 78.1.1"]
build-backend = "setuptools.build_meta"

[dependency-groups]
doc = [
    "sphinx (>=9.1.0,<10.0.0)",
    "furo (==2025.12.19)",
]
lint = [
    "bandit (>=1.9.4,<2.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "flake8-bugbear (>=25.11.29,<26.0.0)",
    "flake8-commas (>=4.0.0,<5.0.0)",
    "flake8-pytest-style (>=2.2.0,<3.0.0)",
    "mypy (>=2.2.0,<3.0.0)",
    "pip-audit (>=2.10.1,<3.0.0)",
    "pylint (>=4.0.6,<5.0.0)",
    "validate-pyproject[all,store] (==0.25)",
]
test = [
    "hypothesis (>=6.155.7,<7.0.0); implementation_name != 'pypy' or python_version >= '3.11'",
    "hypothesis (>=6.155.7,<6.156.0); implementation_name == 'pypy' and python_version < '3.11'",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-benchmark (>=5.2.3,<6.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
]
build = [
    "build",
    "check-wheel-contents (==0.6.3)",
    "twine",
]
dev = [
    "tox (>=4.56.4,<5.0.0)",
    {include-group = "doc"},
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "build"},
]

[tool.pytest]
filterwarnings = ["error"]
strict = true

[tool.tox]
requires = ["tox", "pip"]
env_list = [
    "test",
    "lint",
    "docs",
    "build",
]
skip_missing_interpreters = true

[tool.tox.env_run_base]
skip_install = true
commands = [["python", "--version"]]

[tool.tox.env_base.test]
factors = [["3.14", "3.13", "3.12", "3.11", "3.10", "pypy3.11", "pypy3.10"]]
dependency_groups = ["test"]
commands = [["pytest", {replace = "posargs", default = ["tests/test_lib.py"], extend = true}]]
labels = ["test"]

[tool.tox.env.test]
commands = [["pytest", {replace = "posargs", default = ["tests"], extend = true}]]

[tool.tox.env.lint]
dependency_groups = ["lint"]
commands = [
    ["mypy", "--install-types", "--non-interactive"],
    ["bandit", "-r", "docs", "src"],
    ["flake8", "docs", "src", "tests"],
    ["pylint", "src"],
    ["validate-pyproject", "pyproject.toml"],
    ["pip-audit", "--strict", "--desc", "on", "--aliases", "on"],
]

[tool.tox.env.docs]
dependency_groups = ["doc"]
commands = [
    ["sphinx-build", "-M", "html", "docs/", "docs/_build/", "--nitpicky", "--fail-on-warning"],
]

[tool.tox.env.build]
dependency_groups = ["build"]
commands = [
    ["python", "-m", "build"],
    ["twine", "check", "dist/*"],
    ["check-wheel-contents", "dist/"],
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.mypy]
explicit_package_bases = true
files = [
    "docs",
    "src",
    "tests",
]
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "hypothesis",
    "pytest",
]
ignore_missing_imports = true

[tool.pylint.main]
ignore-paths = [
    "^docs/",
    "^tests/",
]

[tool.pylint.format]
max-line-length = 120
