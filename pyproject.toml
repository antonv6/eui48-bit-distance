[project]
name = "eui48-bit-distance"
version = "0.1.2"
description = "Calculate bit distance between EUI-48 (MAC)."
authors = [
    {name = "Anton Shestakov", email = "av6@dwimlabs.net"}
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
"Source" = "https://github.com/antonv6/eui48-bit-distance"
"Issues" = "https://github.com/antonv6/eui48-bit-distance/issues"
"Changelog" = "https://github.com/antonv6/eui48-bit-distance/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools >= 78.1.1"]
build-backend = "setuptools.build_meta"

[dependency-groups]
lint = [
    "bandit (>=1.9.4,<2.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "flake8-bugbear (>=25.11.29,<26.0.0)",
    "flake8-commas (>=4.0.0,<5.0.0)",
    "flake8-pytest-style (>=2.2.0,<3.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "pylint (>=4.0.6,<5.0.0)",
]
test = [
    "pytest (>=9.1.1,<10.0.0)",
]
build = [
    "build",
    "twine",
]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "build"},
]

[pytest]
addopts = ["--import-mode=importlib"]
strict = true

[tool.mypy]
explicit_package_bases = true
files = [
    "src",
    "tests",
]
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
